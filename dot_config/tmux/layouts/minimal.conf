# ~/.config/tmux/layouts/minimal.conf
# Layout Minimal - inspirado en vaaleyard/tmux-dotbar, adaptado a tmux nativo.
# Colores heredados de la terminal: bg=default (transparente) + colores nombrados ANSI.

# Iconos Compartidos (estáticos)
set -g @icon_zoom "󰊓"
set -g @icon_ssh "󰌘"

# Posición y alineación (dotbar)
set -g status-position top
set -g status-justify absolute-centre

# Barra transparente: hereda fondo/texto de la terminal
set -g status-style "bg=default,fg=default"

# Sesión: cápsula redondeada / al presionar prefix (estilo dotbar)
set -g status-left-length 100
set -g status-left "#{?client_prefix,#[fg=green]#[bg=green fg=black] #S #[fg=green#,bg=default],#[fg=default] #S } "

# Derecha: reloj
set -g status-right-length 100
set -g status-right "#[fg=default] %H:%M "

# Ventanas: solo nombre (sin #I, fiel a dotbar).
# Inactivas: atenuadas (brightblack); Activa: brillante (default) + icono zoom si está en zoom.
# Integración SSH (dotbar): si el pane ejecuta ssh, renombra la ventana al host desde pane_title.
setw -g window-status-separator "  •  "
setw -g window-status-format "#[fg=brightblack]#{?#{==:#{pane_current_command},ssh}, #{@icon_ssh} #(host=\$(echo '#{pane_title}' | sed 's/^ssh //; s/ .*//; s/.*@//; s/:.*//'); if echo \"\$host\" | grep -qE '^[0-9.]+\$|^[0-9]'; then echo '#W'; else echo \"\$host\"; fi | cut -c1-20) , #W }"
setw -g window-status-current-format "#[fg=default]#{?#{==:#{pane_current_command},ssh}, #{@icon_ssh} #(host=\$(echo '#{pane_title}' | sed 's/^ssh //; s/ .*//; s/.*@//; s/:.*//'); if echo \"\$host\" | grep -qE '^[0-9.]+\$|^[0-9]'; then echo '#W'; else echo \"\$host\"; fi | cut -c1-20) , #W }#{?window_zoomed_flag, #[fg=blue]#{@icon_zoom},}"

# Bell y activity (dotbar)
setw -g window-status-bell-style "bg=green,fg=black,bold"
setw -g window-status-activity-style "bg=brightblack,fg=default"

# Estilos heredados de la terminal (ex colors.conf)
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=green"
set -g message-style "fg=default,bg=default"
set -g clock-mode-colour "blue"
set -g mode-style "fg=default,bg=blue"
