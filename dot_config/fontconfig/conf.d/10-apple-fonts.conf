<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
  Optimización de renderizado para Apple SF Mono / Liga SFMono Nerd Font:
  Desactiva el hinting y autohint forzados de FreeType para preservar las curvas
  Bézier y proporciones tipográficas naturales sin quiebres, idéntico al motor
  CoreText de macOS y Skia en Neovide.
  -->
  <match target="font">
    <test name="family" compare="contains">
      <string>SFMono</string>
    </test>
    <edit name="hinting" mode="assign">
      <bool>false</bool>
    </edit>
    <edit name="autohint" mode="assign">
      <bool>false</bool>
    </edit>
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="rgba" mode="assign">
      <const>none</const>
    </edit>
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
  </match>
</fontconfig>
