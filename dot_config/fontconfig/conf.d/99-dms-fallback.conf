<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
  Aliases para el tema por defecto de DMS (DankMaterialShell):
  - "Inter Variable" se resuelve a la familia "Inter" instalada localmente.
  - "Fira Code" se resuelve a la Nerd Font "FiraCode Nerd Font".
  -->
  <alias binding="weak">
    <family>Inter Variable</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>
  <alias binding="weak">
    <family>Fira Code</family>
    <prefer>
      <family>FiraCode Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>