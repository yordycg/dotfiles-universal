"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
command_timeout = 200
format = "$directory$git_branch$git_metrics$package$character"

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[✗](bold red)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold cyan"

[git_branch]
style = "purple"
symbol = ""

[git_metrics]
disabled = false
added_style = "bold yellow"
deleted_style = "bold red"

[package]
format = "version [$version](bold green) "
