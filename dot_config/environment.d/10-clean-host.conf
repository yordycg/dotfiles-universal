# =============================================================================
# 10-clean-host.conf — Entorno de sesión (systemd user environment.d)
# Clean Host: XDG Base Directory + shims de mise disponibles para TODA la
# sesión (GUI, autostart, systemd), no solo para la shell interactiva.
#
# IMPORTANTE: mantener sincronizado con ~/.config/shell/exports.sh
# Referencia: man systemd.environment.d (soporta expansión ${VAR}).
# =============================================================================

# -- XDG Base Directory --
XDG_CONFIG_HOME=${HOME}/.config
XDG_DATA_HOME=${HOME}/.local/share
XDG_CACHE_HOME=${HOME}/.cache
XDG_STATE_HOME=${HOME}/.local/state

# -- Runtimes & Build Tools: data/cache redirigida a XDG --
CARGO_HOME=${XDG_DATA_HOME}/cargo
RUSTUP_HOME=${XDG_DATA_HOME}/rustup
GOPATH=${XDG_DATA_HOME}/go
BUN_INSTALL=${XDG_DATA_HOME}/bun
NPM_CONFIG_USERCONFIG=${XDG_CONFIG_HOME}/npm/npmrc
NPM_CONFIG_CACHE=${XDG_CACHE_HOME}/npm
DOTNET_CLI_HOME=${XDG_DATA_HOME}/dotnet
NUGET_PACKAGES=${XDG_DATA_HOME}/NuGet/packages
CUDA_CACHE_PATH=${XDG_CACHE_HOME}/nv
WGETRC=${XDG_CONFIG_HOME}/wget/wgetrc
GTK2_RC_FILES=${XDG_CONFIG_HOME}/gtk-2.0/gtkrc

# -- PATH: shims de mise a nivel de sesión --
PATH=${HOME}/.local/share/mise/shims:${HOME}/bin:${HOME}/.local/bin:${HOME}/.opencode/bin:${PATH}
