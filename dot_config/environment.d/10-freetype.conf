# =============================================================================
# 10-freetype.conf — Entorno de sesión FreeType (systemd user environment.d)
# Optimización de renderizado para fuentes OpenType CFF (ej. Apple SF Mono):
# - cff:no-stem-darkening=0 asegura que el motor de Adobe aplique stem darkening
#   en tamaños pequeños para evitar texto anémico sobre fondos oscuros.
# - cff:hinting-engine=1 fuerza el motor CFF moderno de Adobe en lugar del legacy.
# =============================================================================
FREETYPE_PROPERTIES="cff:no-stem-darkening=0 cff:hinting-engine=1"
