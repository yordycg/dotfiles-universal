# Matriz global de paquetes curada para la filosofía Clean Host.
# Estructurada por distribución para evitar fallos de nomenclatura en los gestores de paquetes.

fedora:
  base:
    - tailscale
    - age
    - git
    - curl
    - wget
    - unzip
    - zsh
    - jq
    - pwgen
    - tree
    - less
    - man-db
    - man-pages
    - tealdeer
  dev_headers:
    - gcc
    - gcc-c++
    - make
    - cmake
    - pkgconfig
    - aquamarine-devel
    - hyprlang-devel
    - hyprutils-devel
    - hyprwayland-scanner
    - openssl-devel
    - readline-devel
    - sqlite-devel
    - clang
    - valgrind
    - bear
  terminal_ux:
    - gnupg2
    - pinentry
    - gh
    - sqlite
    - oathtool
    - zbar
  desktop_gui:
    - distrobox
    - podman
    - podman-compose
    - flatpak
    - kitty
    - ghostty
    - foot
    - qt5ct
    - qt6ct
    - kvantum
    - gnome-keyring
    - kdeconnect
    - fuse-sshfs
    # Utilidades Wayland genéricas (niri/KDE; antes bajo hyprland):
    - wl-clipboard
    - grim
    - slurp
    - brightnessctl
    - pavucontrol
    - papirus-icon-theme
    - udiskie
    - xorg-xrandr
